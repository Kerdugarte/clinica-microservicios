server.port=8080

spring.application.name=api-gateway

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=health,info,gateway

# Gateway routes
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth,/api/v1/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/usuarios,/api/v1/usuarios/**

spring.cloud.gateway.routes[2].id=security-service
spring.cloud.gateway.routes[2].uri=lb://security-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/security,/api/v1/security/**

spring.cloud.gateway.routes[3].id=ms-pacientes
spring.cloud.gateway.routes[3].uri=lb://ms-pacientes
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/pacientes,/api/v1/pacientes/**

spring.cloud.gateway.routes[4].id=ms-doctores
spring.cloud.gateway.routes[4].uri=lb://ms-doctores
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/doctores,/api/v1/doctores/**

spring.cloud.gateway.routes[5].id=ms-reservas
spring.cloud.gateway.routes[5].uri=lb://ms-reservas
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/reservas,/api/v1/reservas/**

spring.cloud.gateway.routes[6].id=ms-pagos
spring.cloud.gateway.routes[6].uri=lb://ms-pagos
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/pagos,/api/v1/pagos/**

spring.cloud.gateway.routes[7].id=ms-notificaciones
spring.cloud.gateway.routes[7].uri=lb://ms-notificaciones
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/notificaciones,/api/v1/notificaciones/**

spring.cloud.gateway.routes[8].id=ms-reportes
spring.cloud.gateway.routes[8].uri=lb://ms-reportes
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/reportes,/api/v1/reportes/**

spring.cloud.gateway.routes[9].id=ms-historial
spring.cloud.gateway.routes[9].uri=lb://ms-historial
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/v1/historiales,/api/v1/historiales/**

# Logs
logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty=INFO